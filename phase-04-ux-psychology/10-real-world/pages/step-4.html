<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/form.css" />
    <title>Redesign Multi Step</title>
  </head>
  <body>
    <main>
      <form action="success.html">
        <!-- changed to step-3 since this is Step 2 -->
        <fieldset>
          <legend>Choose Interests</legend>

          <!-- Progress bar -->
          <div class="progress-container">
            <div class="progress-track">
              <div class="progress-fill" style="width: 75%"></div>

              <div class="step completed"></div>
              <div class="step completed"></div>
              <div class="step completed"></div>
              <div class="step active"></div>
            </div>

            <p class="step-text">Step 4 of 4</p>
          </div>
          <!-- ← THIS was missing -->

          <!-- Form fields -->
          <div class="form-checkbox">
            <label for="ai">Artificial Intelligence</label>

            <input type="checkbox" name="ai" id="ai" />
          </div>

          <div class="form-checkbox">
            <label for="web-development">Web Development</label>

            <input
              type="checkbox"
              name="web-development"
              id="web-development"
            />
          </div>

          <div class="form-checkbox">
            <label for="design">Design</label>
            <input type="checkbox" name="design" id="design" />
          </div>

          <div class="form-checkbox">
            <label for="blockchain">Blockchain</label>

            <input type="checkbox" name="blockchain" id="blockchain" />
          </div>
        </fieldset>

        <!-- Buttons outside fieldset (recommended) -->
        <div class="buttons">
          <button type="submit">Continue >>></button>
          <a href="step-3.html">← Back</a>
        </div>
      </form>
    </main>
  </body>
</html>
