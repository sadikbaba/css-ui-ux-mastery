<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Feedback</title>
  </head>
  <body>
    <main>
      <section>
        <form action="#">
          <fieldset>
            <legend>First page</legend>
            <div>
              <label for="email">Email</label>
              <input type="text" name="email" id="email" />
            </div>

            <div>
              <label for="password">password</label>
              <input type="password" name="password" id="password" />
            </div>
          </fieldset>

          <button>Login</button>
        </form>
      </section>

      <section>
        <form action="#">
          <fieldset>
            <legend>Loading...</legend>
            <div>
              <label for="email">Email</label>
              <input type="text" name="email" id="email" />
            </div>

            <div>
              <label for="password">password</label>
              <input type="password" name="password" id="password" />
            </div>
          </fieldset>

          <button class="btn-loading">Login....</button>
        </form>
      </section>

      <section>
        <form action="#">
          <fieldset>
            <legend>success page</legend>
            <div>
              <label for="email">Email</label>
              <input type="text" name="email" id="email" />
            </div>

            <div>
              <label for="password">password</label>
              <input type="password" name="password" id="password" />
            </div>
          </fieldset>

          
            <button>Login</button>

            <p>✓ Login successful</p>
       
        </form>
      </section>
    </main>
  </body>
</html>
