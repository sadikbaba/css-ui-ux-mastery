<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selectors & Specificity</title>
    <link rel="stylesheet" href="selectors-specificity.css" />
  </head>
  <body>
    <h1>Selectors & Specificity Practice</h1>

    <!-- 1. Normal paragraph (no class, no id) -->
    <p>This is a normal paragraph</p>

    <!-- 2. Only class -->
    <p class="highlight">This paragraph has only a class</p>

    <!-- 3. Only ID -->
    <p id="special">This paragraph has only an ID</p>

    <!-- 4. Both class + ID -->
    <p id="special" class="highlight">This paragraph has both class and ID</p>
  </body>
</html>
